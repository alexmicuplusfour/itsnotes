<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    html { background: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      color: #eee;
      border-radius: 12px;
      overflow: hidden;
    }
    .card {
      position: relative;
      margin: 0;
      padding: 14px;
      background: #2e2e2e;
      border-radius: 16px;
    }
    .icon-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #aaa;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .icon-btn:hover { background: #3a3a3a; color: #eee; }
    .note-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      margin: 4px 0 4px;
      padding-right: 28px;
      word-break: break-word;
    }
    .note-title .favicon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .settings-head { font-size: 15px; font-weight: 600; margin: 2px 0 4px; padding-right: 28px; }
    .hint { font-size: 12px; color: #999; margin: 0; padding-right: 28px; }
    label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 4px; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #eee;
      font-size: 13px;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .tag-field { position: relative; }
    .tag-suggest {
      list-style: none;
      margin: 4px 0 0;
      padding: 4px;
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      max-height: 160px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }
    .tag-suggest li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      color: #eee;
    }
    .tag-suggest li.active,
    .tag-suggest li:hover { background: #3a3a3a; }
    .tag-suggest li .count { color: #888; font-size: 11px; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    .ok { color: #6cc070; }
    .err { color: #e07070; }
    .muted { color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <button id="gear" class="icon-btn" title="Settings" aria-label="Settings"></button>

    <!-- Clip view -->
    <div id="form" hidden>
      <div id="title" class="note-title"></div>

      <label for="tags">Tags</label>
      <div class="tag-field">
        <input type="text" id="tags" placeholder="read-later, articles" autocomplete="off" />
        <ul id="tagSuggest" class="tag-suggest" hidden></ul>
      </div>

      <button id="save">Save note</button>
      <div id="status" class="muted"></div>
    </div>

    <!-- Settings view -->
    <div id="settings" hidden>
      <div class="settings-head">Settings</div>
      <p class="hint">Enter your itsnotes server address and access token.</p>

      <label for="serverUrl">Server address</label>
      <input type="text" id="serverUrl" placeholder="https://notes.example.com" />

      <label for="token">Access token</label>
      <input type="password" id="token" placeholder="Paste your token" autocomplete="off" />

      <button id="saveSettings">Save</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
